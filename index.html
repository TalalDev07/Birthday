<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday Tyra 💗</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(135deg,#ffe5f1,#ffb8d9);font-family:system-ui,sans-serif;color:#a52c6b;text-align:center;overflow:hidden}main{width:min(92vw,600px);padding:35px 22px;border-radius:28px;background:#ffffffa8;box-shadow:0 12px 40px #d4508533}h1{font-size:clamp(2rem,8vw,4rem);margin:12px 0;color:#e63f8c}p{font-size:1.3rem}button{border:0;border-radius:40px;padding:16px 27px;font-size:1.1rem;font-weight:800;cursor:pointer;touch-action:manipulation}#start,#yes{background:#ed4d98;color:white}#no{background:white;color:#c34680;border:2px solid #f5a3c9}#buttons{display:flex;align-items:center;justify-content:center;gap:20px;min-height:120px}#yes{transform:scale(var(--grow,1));position:relative;z-index:2}#no{position:relative;z-index:3}#no.run{position:fixed;left:var(--x);top:var(--y)}.hidden{display:none}#tease{min-height:2em;font-size:1rem} .heart{position:fixed;pointer-events:none;animation:float 5s linear forwards}@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-110vh);opacity:0}}</style></head><body><main><section id="intro"><div style="font-size:4rem">🎂💗</div><h1>HAPPY BIRTHDAYYY TYRA!!</h1><p>Hope your day is as amazing as you are! 🎀</p><button id="start">One little question 💌</button></section><section id="question" class="hidden"><h1>TYRAAAA 🥺💗</h1><p>Will you invite me to your birthday?</p><div id="buttons"><button id="yes">YESSS 💕</button><button id="no">no 🙄</button></div><p id="tease">Choose wisely ✨</p></section><section id="finish" class="hidden"><div style="font-size:4rem">🎉💗🎂</div><h1>THANKYOUUU!!</h1><p>KNEW YOU'D SAY YESSS 😭💕</p><p>See you thereee!! 🎀</p></section></main><script>const $=id=>document.getElementById(id);let tries=0;const messages=['wrong answer 😭','are you sureeee? 🥺','that button is shy 💅','YES looks so much better 💗','Tyra pleaseeee 😭','nope, try again 🎀'];$('start').onclick=()=>{$('intro').classList.add('hidden');$('question').classList.remove('hidden')};function dodge(){tries++;$('tease').textContent=messages[(tries-1)%messages.length];$('yes').style.setProperty('--grow',Math.min(1+tries*.13,1.85));const n=$('no'),w=n.offsetWidth,h=n.offsetHeight,p=12;let x=p+Math.random()*Math.max(1,innerWidth-w-2*p),y=p+Math.random()*Math.max(1,innerHeight-h-2*p);const a=$('yes').getBoundingClientRect();if(x<a.right+10&&x+w>a.left-10&&y<a.bottom+10&&y+h>a.top-10)y=a.top>h+25?p:innerHeight-h-p;n.style.setProperty('--x',x+'px');n.style.setProperty('--y',y+'px');n.classList.add('run')}$('no').addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')dodge()});$('no').addEventListener('click',e=>{e.preventDefault();dodge()});$('no').addEventListener('touchstart',e=>{e.preventDefault();dodge()},{passive:false});$('yes').onclick=()=>{$('question').classList.add('hidden');$('no').classList.remove('run');$('finish').classList.remove('hidden');for(let i=0;i<60;i++){let s=document.createElement('span');s.className='heart';s.textContent=['💗','💕','🎉','✨'][i%4];s.style.left=Math.random()*100+'vw';s.style.top=(40+Math.random()*60)+'vh';s.style.fontSize=(18+Math.random()*25)+'px';s.style.animationDelay=Math.random()*2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),7000)}};</script></body></html>
